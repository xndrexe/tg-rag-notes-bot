[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-rag-notes-bot"
version = "0.1.0"
description = "Telegram-бот, который индексирует PDF/DOCX/Markdown-документы и отвечает на вопросы по их содержимому через RAG."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aleksandr Kostiukhov", email = "102666804+xndrexe@users.noreply.github.com" }]
keywords = ["telegram", "bot", "rag", "llm", "embeddings", "aiogram"]

dependencies = [
    "aiogram>=3.4,<4",
    "numpy>=1.26",
    "sentence-transformers>=2.7",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
tg-rag-bot = "tg_rag_bot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_rag_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",
    "RUF001", # Cyrillic letters in strings — это интерактивный бот на русском
    "RUF002", # Same — for docstrings
    "RUF003", # Same — for comments
]

[tool.mypy]
# Версию Python mypy берёт у интерпретатора, которым запущен: свежая numpy
# пишет заглушки синтаксисом 3.12, и жёсткое "3.11" роняет разбор на CI.
strict = true
ignore_missing_imports = true
